# Redis configuration for session tracking
port 6379
bind 0.0.0.0

# Enable keyspace notifications for expired events
notify-keyspace-events Ex

# Persistence (optional)
save 900 1
save 300 10
save 60 10000

# Security
requirepass ""

# Performance
maxmemory 100mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile ""